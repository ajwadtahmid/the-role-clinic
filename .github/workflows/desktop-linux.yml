name: Linux desktop release
on:
  # Called by release.yml on a version tag. Run by hand only to try a build; that makes no release.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run desktop:check
      # The same script runs locally (bash scripts/ci-desktop-linux.sh), so a failure can be reproduced for free.
      - name: Build on the oldest supported Linux baseline
        run: |
          bash scripts/ci-desktop-linux.sh image
          CARGO_BUILD_JOBS=2 bash scripts/ci-desktop-linux.sh build
      - name: Check the actual AppImage payload and native launcher
        run: bash scripts/ci-desktop-linux.sh smoke
      - name: Collect development installers and checksums
        run: node scripts/collect-desktop.mjs dist/desktop-target/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: the-role-clinic-desktop-linux-x64
          path: |
            dist/desktop-linux-x64-glibc-*/
            dist/appimage-evidence/
          if-no-files-found: error
          retention-days: 14
